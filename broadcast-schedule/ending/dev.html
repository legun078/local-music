<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#F4F7FB" />
  <title>실시간 데이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumGothic/NanumGothic.css" />
  <script>
    window.CREDITS_BASE = (function () {
      const p = location.pathname;
      if (p === "/ending" || p.startsWith("/ending/")) return "/ending";
      return "";
    })();
    window.ENDING_CACHE_V = String(Date.now());
    (function () {
      var v = window.ENDING_CACHE_V;
      var prefix = window.CREDITS_BASE ? window.CREDITS_BASE + "/" : "";
      function css(href) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href + "?v=" + v;
        document.head.appendChild(link);
      }
      css(prefix + "css/collector.css");
      css(prefix + "css/dev-monitor.css");
    })();
  </script>
</head>
<body class="credits-collector-page ending-dev-page">
  <div class="ending-dev-shell">
    <header class="ending-dev-bar">
      <div class="ending-dev-bar__brand">
        <span class="ending-dev-bar__mark" aria-hidden="true"></span>
        <div>
          <p class="ending-dev-bar__kicker">SIRIAN-CAL</p>
          <h1 class="ending-dev-bar__title">실시간 데이터</h1>
        </div>
      </div>
      <nav class="ending-dev-bar__nav" aria-label="엔딩 메뉴">
        <a href="./">수집기</a>
        <a href="studio">스튜디오</a>
        <a href="diary" hidden aria-hidden="true" tabindex="-1">일기장</a>
      </nav>
      <div class="ending-dev-bar__tools">
        <span class="ending-dev-stamp" id="dev-stamp">—</span>
        <label class="ending-dev-auto">
          <input type="checkbox" id="dev-auto" checked />
          자동
        </label>
        <button type="button" class="ending-dev-refresh" id="btn-dev-refresh">새로고침</button>
      </div>
    </header>

    <section class="ending-dev-gate" id="dev-gate" hidden>
      <h2>접근 제한</h2>
      <p id="dev-gate-msg">
        오버레이 개발자 숲 계정으로 수집기에서 로그인한 뒤 다시 열어 주세요.
      </p>
      <a class="ending-dev-refresh ending-dev-refresh--primary" href="./">수집기로 이동</a>
    </section>

    <div id="dev-app" class="ending-dev-app" hidden>
      <section class="ending-dev-overview" aria-label="채널과 연결 상태">
        <div class="ending-dev-tabs" role="tablist" aria-label="채널 선택">
          <button
            type="button"
            class="ending-dev-tab"
            role="tab"
            id="tab-sirian"
            aria-selected="true"
            aria-controls="panel-account"
            data-tab="sirian"
          >
            <span class="ending-dev-tab__label">시리안</span>
            <code class="ending-dev-tab__id" id="tab-sirian-id">sirianrain</code>
            <span class="ending-dev-tab__dot" id="tab-sirian-dot" hidden></span>
          </button>
          <button
            type="button"
            class="ending-dev-tab"
            role="tab"
            id="tab-me"
            aria-selected="false"
            aria-controls="panel-account"
            data-tab="me"
          >
            <span class="ending-dev-tab__label">내 계정</span>
            <code class="ending-dev-tab__id" id="tab-me-id">—</code>
            <span class="ending-dev-tab__dot" id="tab-me-dot" hidden></span>
          </button>
        </div>
        <section class="ending-dev-hero" id="dev-strip" aria-label="연결 상태"></section>
      </section>

      <article class="ending-dev-card ending-dev-panel is-idle" id="panel-account" role="tabpanel">
        <header class="ending-dev-card__head">
          <div class="ending-dev-card__identity">
            <p class="ending-dev-card__label" id="acc-label">시리안</p>
            <h2 class="ending-dev-card__title" id="acc-title">—</h2>
            <p class="ending-dev-card__title-line" id="acc-broadcast">—</p>
            <p class="ending-dev-meta" id="acc-meta">—</p>
          </div>
          <div class="ending-dev-card__controls">
            <div class="ending-dev-badges">
              <span class="ending-dev-badge" id="acc-badge">—</span>
              <span class="ending-dev-badge" id="acc-ssapi-badge">SSAPI</span>
            </div>
            <div class="ending-dev-viewmode" id="acc-viewmode" role="tablist" aria-label="보기 모드">
              <button type="button" class="ending-dev-viewmode__btn is-on" data-view="live" id="view-live">현재</button>
              <button type="button" class="ending-dev-viewmode__btn" data-view="history" id="view-history">날짜별</button>
            </div>
          </div>
        </header>

        <p class="ending-dev-note" id="acc-note" hidden></p>

        <section class="ending-dev-history" id="acc-history" hidden aria-label="날짜별 아카이브">
          <div class="ending-dev-history__row">
            <label class="ending-dev-history__label" for="acc-history-date">날짜</label>
            <select id="acc-history-date" class="ending-dev-history__select"></select>
          </div>
          <div class="ending-dev-history__list" id="acc-history-list"></div>
        </section>

        <div class="ending-dev-flags" id="acc-flags"></div>
        <dl class="ending-dev-stats" id="acc-stats"></dl>
        <figure class="ending-dev-peak" id="acc-peak" hidden>
          <div class="ending-dev-peak__media">
            <img id="acc-peak-img" alt="최고 시청 순간 썸네일" />
          </div>
          <figcaption class="ending-dev-peak__cap" id="acc-peak-cap"></figcaption>
        </figure>

        <section class="ending-dev-data" aria-label="수집 데이터">
          <div class="ending-dev-data__head">
            <h3 class="ending-dev-sec-title">수집 데이터</h3>
            <p class="ending-dev-data__hint" id="acc-data-hint">카테고리 선택</p>
          </div>
          <div class="ending-dev-data-nav" id="acc-data-nav" role="tablist" aria-label="데이터 카테고리"></div>
          <div class="ending-dev-data-body" id="acc-data-body" role="tabpanel"></div>
        </section>

        <div class="ending-dev-segments" id="acc-segments"></div>
      </article>
    </div>
  </div>
  <script>
    (function () {
      var prefix = window.CREDITS_BASE ? window.CREDITS_BASE + "/" : "";
      var s = document.createElement("script");
      s.src = prefix + "js/dev-monitor.js?v=" + (window.ENDING_CACHE_V || Date.now());
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
